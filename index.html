<!DOCTYPE html>
<html lang="ur" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex, nofollow">
<title>Advanced Gold Rate & Item Price Calculator</title>

<!-- PWA Manifest Data URI for Offline App Support -->
<link rel="manifest" href='data:application/manifest+json,{"name":"Gold Calculator","short_name":"GoldCalc","start_url":".","display":"standalone","background_color":"#0b0f19","theme_color":"#0b0f19","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2683/2683058.png","sizes":"512x512","type":"image/png"}]}'>

<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #0b0f19;
    color: #e0e6ed;
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 580px;
    margin: 0 auto;
    background: #111827;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid #1f293d;
  }
  h2, h3 {
    color: #ffd700;
    text-align: center;
    margin-bottom: 20px;
  }
  .input-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #9da8b9;
    font-size: 14px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2d3748;
    background: #1a2332;
    color: #fff;
    font-size: 16px;
    box-sizing: border-box;
  }
  input:focus, select:focus {
    border-color: #ffd700;
    outline: none;
  }

  /* Live Text Helper Badge */
  .words-helper {
    font-size: 13px;
    color: #00e676;
    font-weight: 600;
    margin-top: 5px;
    display: block;
  }

  /* Mode Switcher Buttons Style */
  .switch-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .btn-group {
    display: flex;
    background: #1a2332;
    padding: 3px;
    border-radius: 8px;
    border: 1px solid #2d3748;
  }
  .btn-group button {
    background: transparent;
    border: none;
    color: #9da8b9;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-group button.active {
    background: #ffd700;
    color: #000;
  }

  /* Main Transaction Switcher */
  .main-switch {
    width: 100%;
    margin-bottom: 20px;
  }
  .main-switch button {
    flex: 1;
    padding: 10px;
    font-size: 15px;
  }

  /* TMR Layout Grid */
  .tmr-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  .converted-grams-badge {
    text-align: right;
    font-size: 14px;
    color: #ffd700;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .rate-info-badge {
    background: #1a2332;
    border: 1px solid #2d3748;
    padding: 10px 14px;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 13px;
    color: #ffd700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    margin-bottom: 15px;
    background: #1a2332;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2d3748;
  }
  .checkbox-group input {
    width: auto;
    cursor: pointer;
  }
  .checkbox-group label {
    margin-bottom: 0;
    cursor: pointer;
    font-size: 13px;
    color: #ffd700;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
    background: #1a2332;
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #2d3748;
  }
  th {
    background-color: #ffd700;
    color: #000;
  }
  tr:last-child td {
    border-bottom: none;
  }

  .result-box {
    background: #1c1a0e;
    border: 2px solid #ffd700;
    padding: 18px;
    border-radius: 10px;
    text-align: center;
    margin-top: 20px;
  }
  .result-title {
    font-size: 14px;
    color: #a0a0a0;
  }
  .result-value {
    font-size: 30px;
    font-weight: bold;
    color: #ffd700;
    margin-top: 5px;
  }
  .result-words {
    font-size: 14px;
    color: #00e676;
    font-weight: bold;
    margin-top: 4px;
  }
  .breakdown {
    font-size: 13px;
    color: #ccc;
    margin-top: 12px;
    line-height: 1.6;
    text-align: left;
  }
  hr {
    border: 0;
    height: 1px;
    background: #2d3748;
    margin: 25px 0;
  }
</style>
</head>
<body class="notranslate">

<div class="container notranslate">
  <h2>🪙 Gold Rate Calculator</h2>

  <!-- 24K Rate Input -->
  <div class="input-group">
    <label for="rate24k">24 Karat Rate Per Tola (PKR):</label>
    <input type="number" id="rate24k" inputmode="decimal" autocomplete="off" placeholder="e.g. 425000" value="425000" oninput="calculateRates()">
    <span class="words-helper" id="rate24kWords">🏷️ 4 Lakh 25 Hazar PKR</span>
  </div>

  <!-- Live Karat Table -->
  <h3>Live Karat Comparison</h3>
  <table>
    <thead>
      <tr>
        <th>Karat</th>
        <th>Per Tola (PKR)</th>
        <th>Per Gram (PKR)</th>
      </tr>
    </thead>
    <tbody id="karatTable">
      <!-- Populated via JS -->
    </tbody>
  </table>

  <hr>

  <h3>💍 Item Price Calculator</h3>

  <!-- BUY / SELL MODE SWITCH -->
  <div class="btn-group main-switch">
    <button id="btnBuyMode" class="active" onclick="setTransactionMode('buy')">🛒 Buy Mode</button>
    <button id="btnSellMode" onclick="setTransactionMode('sell')">💰 Sell Mode</button>
  </div>

  <!-- Custom Karat Input -->
  <div class="input-group">
    <label for="inputKarat">Karat Input Karein (e.g. 21, 22, 18, 15):</label>
    <input type="number" id="inputKarat" inputmode="decimal" autocomplete="off" placeholder="e.g. 21" value="21" min="1" max="24" step="0.1" oninput="calculateItemPrice()">
    <div class="rate-info-badge" id="karatRateBadge">
      <span>Purity: <strong id="karatPurityDisplay">87.50%</strong></span>
      <span>Tola: <strong id="karatTolaDisplay">Rs. 0</strong></span>
      <span>Gram: <strong id="karatGramDisplay">Rs. 0</strong></span>
    </div>
  </div>

  <!-- WEIGHT INPUT MODE SWITCH -->
  <div class="input-group">
    <div class="switch-header">
      <label>⚖️ Weight Input Mode</label>
      <div class="btn-group">
        <button id="btnGram" class="active" onclick="setWeightMode('gram')">Grams</button>
        <button id="btnTmr" onclick="setWeightMode('tmr')">TMR</button>
      </div>
    </div>

    <!-- Gram Mode Input -->
    <div id="gramInputBox">
      <input type="number" id="itemWeightGram" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.85" value="2.85" step="0.01" oninput="calculateItemPrice()">
    </div>

    <!-- TMR Mode Inputs -->
    <div id="tmrInputBox" style="display: none;">
      <div class="converted-grams-badge">Total: <span id="convertedGrams">0.000</span> g</div>
      <div class="tmr-grid">
        <div>
          <label>Tola</label>
          <input type="number" id="inputTola" inputmode="decimal" autocomplete="off" placeholder="Tola" value="0" oninput="calculateItemPrice()">
        </div>
        <div>
          <label>Masha</label>
          <input type="number" id="inputMasha" inputmode="decimal" autocomplete="off" placeholder="Masha" value="4" oninput="calculateItemPrice()">
        </div>
        <div>
          <label>Rati</label>
          <input type="number" id="inputRati" inputmode="decimal" autocomplete="off" placeholder="Rati" value="2.5" oninput="calculateItemPrice()">
        </div>
      </div>
    </div>
  </div>

  <!-- SELL MODE SPECIFIC OPTIONS -->
  <div id="sellOptionsBox" style="display: none;">
    <div class="input-group">
      <label for="stoneWeight">Nag / Stone Weight Deduction (Grams):</label>
      <input type="number" id="stoneWeight" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.2" value="" step="0.01" oninput="calculateItemPrice()">
    </div>
    <div class="input-group">
      <label for="sellDiscountTola">Shop Buying Rate Discount Per Tola (PKR):</label>
      <input type="number" id="sellDiscountTola" inputmode="decimal" autocomplete="off" placeholder="e.g. 2000" value="" step="500" oninput="calculateItemPrice()">
    </div>
  </div>

  <!-- WASTAGE (KAAT) MODE SWITCH & INPUT -->
  <div class="input-group">
    <div class="switch-header">
      <label id="wastageLabel">Wastage / Kaat</label>
      <div class="btn-group">
        <button id="btnWastagePercent" class="active" onclick="setWastageMode('percent')">Percentage (%)</button>
        <button id="btnWastageFixed" onclick="setWastageMode('fixed')">Fixed Price (PKR)</button>
      </div>
    </div>
    <input type="number" id="wastageValue" inputmode="decimal" autocomplete="off" placeholder="e.g. 10 or 1000" value="" step="0.5" oninput="calculateItemPrice()">
  </div>

  <!-- BUY MODE SPECIFIC OPTIONS -->
  <div id="buyOptionsBox">
    <!-- MAKING CHARGES MODE SWITCH -->
    <div class="input-group">
      <div class="switch-header">
        <label>🔨 Making Charges / Mazdoori (PKR)</label>
        <div class="btn-group">
          <button id="btnMakingFixed" class="active" onclick="setMakingMode('fixed')">Fixed Price</button>
          <button id="btnMakingPerGram" onclick="setMakingMode('perGram')">Per Gram</button>
        </div>
      </div>
      <input type="number" id="makingValue" inputmode="decimal" autocomplete="off" placeholder="e.g. 2000" value="" oninput="calculateItemPrice()">
    </div>

    <!-- Tax Input -->
    <div class="input-group">
      <label for="taxRate">Tax % (GST / Govt Tax):</label>
      <input type="number" id="taxRate" inputmode="decimal" autocomplete="off" placeholder="e.g. 10" value="" step="0.1" oninput="calculateItemPrice()">
    </div>

    <!-- Tax Checkbox -->
    <div class="checkbox-group">
      <input type="checkbox" id="taxOnSubtotal" checked onchange="calculateItemPrice()">
      <label for="taxOnSubtotal">Apply Tax on Whole Subtotal (Gold + Wastage + Making)</label>
    </div>
  </div>

  <!-- Result Box -->
  <div class="result-box">
    <div class="result-title" id="resultTitle">Total Estimated Price</div>
    <div class="result-value" id="finalPrice">Rs. 0</div>
    <div class="result-words" id="finalPriceWords"></div>
    <div class="breakdown" id="priceBreakdown"></div>
  </div>
</div>

<script>
  const TOLA_GRAMS = 11.664;
  const MASHA_PER_TOLA = 12;
  const RATI_PER_MASHA = 8;
  const RATI_PER_TOLA = 96;

  let transactionMode = 'buy'; 
  let weightMode = 'gram';      
  let wastageMode = 'percent';  
  let makingMode = 'fixed';      

  // Pak/Ind Number System to Words (Crore, Lakh, Hazar)
  function formatAmountInWords(num) {
    num = Math.round(num);
    if (!num || num <= 0) return '';
    
    let words = [];
    
    const crore = Math.floor(num / 10000000);
    num %= 10000000;
    
    const lakh = Math.floor(num / 100000);
    num %= 100000;
    
    const hazar = Math.floor(num / 1000);
    num %= 1000;
    
    const remaining = num;

    if (crore > 0) words.push(`${crore} Crore`);
    if (lakh > 0) words.push(`${lakh} Lakh`);
    if (hazar > 0) words.push(`${hazar} Hazar`);
    if (remaining > 0 && words.length === 0) words.push(`${remaining}`);

    return words.join(' ') + ' PKR';
  }

  function setTransactionMode(mode) {
    transactionMode = mode;
    document.getElementById('btnBuyMode').classList.toggle('active', mode === 'buy');
    document.getElementById('btnSellMode').classList.toggle('active', mode === 'sell');

    const buyBox = document.getElementById('buyOptionsBox');
    const sellBox = document.getElementById('sellOptionsBox');
    const wastageLabel = document.getElementById('wastageLabel');
    const resultTitle = document.getElementById('resultTitle');

    if (mode === 'buy') {
      buyBox.style.display = 'block';
      sellBox.style.display = 'none';
      wastageLabel.innerText = 'Wastage (Kaat Add)';
      resultTitle.innerText = 'Total Customer Pay Amount (Buy)';
    } else {
      buyBox.style.display = 'none';
      sellBox.style.display = 'block';
      wastageLabel.innerText = 'Kaat / Deduction';
      resultTitle.innerText = 'Total Customer Receive Amount (Sell)';
    }

    calculateItemPrice();
  }

  function setWastageMode(mode) {
    wastageMode = mode;
    document.getElementById('btnWastagePercent').classList.toggle('active', mode === 'percent');
    document.getElementById('btnWastageFixed').classList.toggle('active', mode === 'fixed');
    calculateItemPrice();
  }

  function setWeightMode(mode) {
    weightMode = mode;
    const btnGram = document.getElementById('btnGram');
    const btnTmr = document.getElementById('btnTmr');
    const gramBox = document.getElementById('gramInputBox');
    const tmrBox = document.getElementById('tmrInputBox');

    if (mode === 'gram') {
      btnGram.classList.add('active');
      btnTmr.classList.remove('active');
      gramBox.style.display = 'block';
      tmrBox.style.display = 'none';
    } else {
      btnGram.classList.remove('active');
      btnTmr.classList.add('active');
      gramBox.style.display = 'none';
      tmrBox.style.display = 'block';
      
      const currentGram = parseFloat(document.getElementById('itemWeightGram').value) || 0;
      if (currentGram > 0 && parseFloat(document.getElementById('inputTola').value) === 0) {
        syncGramsToTMR(currentGram);
      }
    }
    calculateItemPrice();
  }

  function syncGramsToTMR(grams) {
    const totalTolas = grams / TOLA_GRAMS;
    const tola = Math.floor(totalTolas);
    
    const remTola = totalTolas - tola;
    const totalMasha = remTola * MASHA_PER_TOLA;
    const masha = Math.floor(totalMasha);
    
    const remMasha = totalMasha - masha;
    const rati = Math.round(remMasha * RATI_PER_MASHA * 10) / 10;

    document.getElementById('inputTola').value = tola;
    document.getElementById('inputMasha').value = masha;
    document.getElementById('inputRati').value = rati;
  }

  function setMakingMode(mode) {
    makingMode = mode;
    document.getElementById('btnMakingFixed').classList.toggle('active', mode === 'fixed');
    document.getElementById('btnMakingPerGram').classList.toggle('active', mode === 'perGram');
    calculateItemPrice();
  }

  function calculateRates() {
    const rate24k = parseFloat(document.getElementById('rate24k').value) || 0;
    
    // Update Rate Input Helper Badge
    const rateWords = formatAmountInWords(rate24k);
    document.getElementById('rate24kWords').innerText = rateWords ? `🏷️ ${rateWords}` : '';

    const rate24kGram = rate24k / TOLA_GRAMS;

    const karats = [
      { name: '24 Karat', purity: 1.0 },
      { name: '22 Karat', purity: 22 / 24 },
      { name: '21 Karat', purity: 21 / 24 },
      { name: '18 Karat', purity: 18 / 24 },
      { name: '12 Karat', purity: 12 / 24 }
    ];

    let tableBody = '';
    karats.forEach(k => {
      const perTola = rate24k * k.purity;
      const perGram = rate24kGram * k.purity;
      tableBody += `
        <tr>
          <td><strong>${k.name}</strong></td>
          <td>Rs. ${Math.round(perTola).toLocaleString('en-PK')}</td>
          <td>Rs. ${Math.round(perGram).toLocaleString('en-PK')}</td>
        </tr>
      `;
    });

    document.getElementById('karatTable').innerHTML = tableBody;
    calculateItemPrice();
  }

  function calculateItemPrice() {
    const marketRate24k = parseFloat(document.getElementById('rate24k').value) || 0;
    
    let effective24kRate = marketRate24k;
    if (transactionMode === 'sell') {
      const discountTola = parseFloat(document.getElementById('sellDiscountTola').value) || 0;
      effective24kRate = Math.max(0, marketRate24k - discountTola);
    }

    const rate24kGram = effective24kRate / TOLA_GRAMS;
    
    // Custom Karat Input Handling
    let selectedKarat = parseFloat(document.getElementById('inputKarat').value) || 24;
    if (selectedKarat > 24) selectedKarat = 24;
    if (selectedKarat < 0) selectedKarat = 0;

    const purity = selectedKarat / 24;
    const karatTolaPrice = effective24kRate * purity;
    const karatGramPrice = rate24kGram * purity;

    // Update Karat Badge Display
    document.getElementById('karatPurityDisplay').innerText = (purity * 100).toFixed(2) + '%';
    document.getElementById('karatTolaDisplay').innerText = 'Rs. ' + Math.round(karatTolaPrice).toLocaleString('en-PK');
    document.getElementById('karatGramDisplay').innerText = 'Rs. ' + Math.round(karatGramPrice).toLocaleString('en-PK');

    // Weight Calculation
    let grossGrams = 0;
    if (weightMode === 'gram') {
      grossGrams = parseFloat(document.getElementById('itemWeightGram').value) || 0;
    } else {
      const tola = parseFloat(document.getElementById('inputTola').value) || 0;
      const masha = parseFloat(document.getElementById('inputMasha').value) || 0;
      const rati = parseFloat(document.getElementById('inputRati').value) || 0;

      const totalTolas = tola + (masha / MASHA_PER_TOLA) + (rati / RATI_PER_TOLA);
      grossGrams = totalTolas * TOLA_GRAMS;
      
      const badge = document.getElementById('convertedGrams');
      if (badge) badge.innerText = grossGrams.toFixed(3);
    }

    let stoneDeduction = 0;
    if (transactionMode === 'sell') {
      stoneDeduction = parseFloat(document.getElementById('stoneWeight').value) || 0;
    }
    const netGrams = Math.max(0, grossGrams - stoneDeduction);

    const rawGoldPrice = netGrams * karatGramPrice;

    // Wastage / Kaat Calculation
    const wastageInputValue = parseFloat(document.getElementById('wastageValue').value) || 0;
    let wastageAmount = 0;
    let wastageLabelMode = '';

    if (wastageMode === 'percent') {
      wastageAmount = rawGoldPrice * (wastageInputValue / 100);
      wastageLabelMode = `${wastageInputValue}%`;
    } else {
      wastageAmount = wastageInputValue;
      wastageLabelMode = `Rs. ${wastageInputValue.toLocaleString('en-PK')} Fixed`;
    }

    let totalMaking = 0;
    let taxAmount = 0;
    let totalPrice = 0;

    const breakdownBox = document.getElementById('priceBreakdown');

    if (transactionMode === 'buy') {
      const makingInputValue = parseFloat(document.getElementById('makingValue').value) || 0;
      totalMaking = makingMode === 'fixed' ? makingInputValue : (makingInputValue * netGrams);

      const taxPercent = parseFloat(document.getElementById('taxRate').value) || 0;
      const isTaxOnSubtotal = document.getElementById('taxOnSubtotal').checked;

      if (isTaxOnSubtotal) {
        const subTotal = rawGoldPrice + wastageAmount + totalMaking;
        taxAmount = subTotal * (taxPercent / 100);
      } else {
        taxAmount = rawGoldPrice * (taxPercent / 100);
      }

      totalPrice = rawGoldPrice + wastageAmount + totalMaking + taxAmount;

      const taxLabelMode = isTaxOnSubtotal ? 'Full Subtotal' : 'Raw Gold Only';
      const makingLabelMode = makingMode === 'fixed' ? 'Fixed Total' : `Rs. ${makingInputValue} / gram`;

      breakdownBox.innerHTML = `
        • <strong>Selected Rate (${selectedKarat}K):</strong> Rs. ${Math.round(karatGramPrice).toLocaleString('en-PK')} / gram<br>
        • <strong>Calculated Weight:</strong> ${netGrams.toFixed(3)} grams<br>
        • <strong>Raw Gold Price:</strong> Rs. ${Math.round(rawGoldPrice).toLocaleString('en-PK')}<br>
        • <strong>Wastage Amount (+${wastageLabelMode}):</strong> Rs. ${Math.round(wastageAmount).toLocaleString('en-PK')}<br>
        • <strong>Making Charges (${makingLabelMode}):</strong> Rs. ${Math.round(totalMaking).toLocaleString('en-PK')}<br>
        • <strong>Tax Amount (${taxPercent}% on ${taxLabelMode}):</strong> Rs. ${Math.round(taxAmount).toLocaleString('en-PK')}
      `;

    } else {
      // Sell Mode Calculation
      totalPrice = Math.max(0, rawGoldPrice - wastageAmount);

      const discountTola = parseFloat(document.getElementById('sellDiscountTola').value) || 0;

      breakdownBox.innerHTML = `
        • <strong>Buying Rate (${selectedKarat}K):</strong> Rs. ${Math.round(karatGramPrice).toLocaleString('en-PK')} / gram <em>(-Rs. ${discountTola}/tola)</em><br>
        • <strong>Gross Weight:</strong> ${grossGrams.toFixed(3)} grams<br>
        • <strong>Nag / Stone Deduction:</strong> -${stoneDeduction.toFixed(3)} grams<br>
        • <strong>Net Gold Weight:</strong> ${netGrams.toFixed(3)} grams<br>
        • <strong>Base Gold Value:</strong> Rs. ${Math.round(rawGoldPrice).toLocaleString('en-PK')}<br>
        • <strong>Kaat / Deduction (-${wastageLabelMode}):</strong> -Rs. ${Math.round(wastageAmount).toLocaleString('en-PK')}
      `;
    }

    // UI Updates
    document.getElementById('finalPrice').innerText = 'Rs. ' + Math.round(totalPrice || 0).toLocaleString('en-PK');
    document.getElementById('finalPriceWords').innerText = formatAmountInWords(totalPrice);
  }

  // Run on page load
  calculateRates();
</script>
</body>
</html>
