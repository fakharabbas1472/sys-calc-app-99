<!DOCTYPE html>
<html lang="ur" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex, nofollow">
<title>Advanced Gold Rate & Item Price Calculator</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: #0b0f19;
    color: #e0e6ed;
    margin: 0;
    padding: 15px;
  }
  .container {
    max-width: 580px;
    margin: 0 auto;
    background: #111827;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid #1f293d;
  }
  h2, h3 {
    color: #ffd700;
    text-align: center;
    margin-top: 10px;
    margin-bottom: 15px;
  }
  .input-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #9da8b9;
    font-size: 14px;
  }
  
  /* Text and Number Inputs Only */
  input[type="number"], input[type="text"], select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2d3748;
    background: #1a2332;
    color: #fff;
    font-size: 16px;
    -webkit-appearance: none;
  }
  input[type="number"]:focus, input[type="text"]:focus, select:focus {
    border-color: #ffd700;
    outline: none;
  }

  .words-helper {
    font-size: 13px;
    color: #00e676;
    font-weight: 600;
    margin-top: 5px;
    display: block;
  }

  .switch-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .btn-group {
    display: flex;
    background: #1a2332;
    padding: 3px;
    border-radius: 8px;
    border: 1px solid #2d3748;
  }
  .btn-group button {
    background: transparent;
    border: none;
    color: #9da8b9;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn-group button.active {
    background: #ffd700;
    color: #000;
  }

  .main-switch {
    width: 100%;
    margin-bottom: 20px;
  }
  .main-switch button {
    flex: 1;
    padding: 10px;
    font-size: 15px;
  }

  .tmr-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }

  .converted-grams-badge {
    text-align: right;
    font-size: 14px;
    color: #ffd700;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .rate-info-badge {
    background: #1a2332;
    border: 1px solid #2d3748;
    padding: 10px 14px;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 13px;
    color: #ffd700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  /* Fixed Checkbox Styles */
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    margin-bottom: 15px;
    background: #1a2332;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2d3748;
  }
  .checkbox-group input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #ffd700; /* Custom yellow check color */
    -webkit-appearance: checkbox;
  }
  .checkbox-group label {
    margin-bottom: 0;
    cursor: pointer;
    font-size: 13px;
    color: #ffd700;
    line-height: 1.3;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 15px 0;
    background: #1a2332;
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #2d3748;
  }
  th {
    background-color: #ffd700;
    color: #000;
  }

  .result-box {
    background: #1c1a0e;
    border: 2px solid #ffd700;
    padding: 18px;
    border-radius: 10px;
    text-align: center;
    margin-top: 20px;
  }
  .result-title {
    font-size: 14px;
    color: #a0a0a0;
  }
  .result-value {
    font-size: 28px;
    font-weight: bold;
    color: #ffd700;
    margin-top: 5px;
  }
  .result-words {
    font-size: 14px;
    color: #00e676;
    font-weight: bold;
    margin-top: 4px;
  }
  .breakdown {
    font-size: 13px;
    color: #ccc;
    margin-top: 12px;
    line-height: 1.6;
    text-align: left;
  }
  hr {
    border: 0;
    height: 1px;
    background: #2d3748;
    margin: 20px 0;
  }
</style>
</head>
<body class="notranslate">

<div class="container notranslate">
  <h2>🪙 Gold Rate Calculator</h2>

  <div class="input-group">
    <label for="rate24k">24 Karat Rate Per Tola (PKR):</label>
    <input type="number" id="rate24k" inputmode="decimal" autocomplete="off" value="425000">
    <span class="words-helper" id="rate24kWords">🏷️ 4 Lakh 25 Hazar PKR</span>
  </div>

  <h3>Live Karat Comparison</h3>
  <table>
    <thead>
      <tr>
        <th>Karat</th>
        <th>Per Tola (PKR)</th>
        <th>Per Gram (PKR)</th>
      </tr>
    </thead>
    <tbody id="karatTable"></tbody>
  </table>

  <hr>

  <h3>💍 Item Price Calculator</h3>

  <div class="btn-group main-switch">
    <button id="btnBuyMode" class="active" type="button">🛒 Buy Mode</button>
    <button id="btnSellMode" type="button">💰 Sell Mode</button>
  </div>

  <div class="input-group">
    <label for="inputKarat">Karat Input Karein (e.g. 21, 22, 18):</label>
    <input type="number" id="inputKarat" inputmode="decimal" autocomplete="off" value="21" min="1" max="24" step="0.1">
    <div class="rate-info-badge">
      <span>Purity: <strong id="karatPurityDisplay">87.50%</strong></span>
      <span>Tola: <strong id="karatTolaDisplay">Rs. 0</strong></span>
      <span>Gram: <strong id="karatGramDisplay">Rs. 0</strong></span>
    </div>
  </div>

  <div class="input-group">
    <div class="switch-header">
      <label>⚖️ Weight Input Mode</label>
      <div class="btn-group">
        <button id="btnGram" class="active" type="button">Grams</button>
        <button id="btnTmr" type="button">TMR</button>
      </div>
    </div>

    <div id="gramInputBox">
      <input type="number" id="itemWeightGram" inputmode="decimal" autocomplete="off" value="2.85" step="0.01">
    </div>

    <div id="tmrInputBox" style="display: none;">
      <div class="converted-grams-badge">Total: <span id="convertedGrams">0.000</span> g</div>
      <div class="tmr-grid">
        <div>
          <label>Tola</label>
          <input type="number" id="inputTola" inputmode="decimal" autocomplete="off" value="0">
        </div>
        <div>
          <label>Masha</label>
          <input type="number" id="inputMasha" inputmode="decimal" autocomplete="off" value="4">
        </div>
        <div>
          <label>Rati</label>
          <input type="number" id="inputRati" inputmode="decimal" autocomplete="off" value="2.5">
        </div>
      </div>
    </div>
  </div>

  <div id="sellOptionsBox" style="display: none;">
    <div class="input-group">
      <label for="stoneWeight">Nag / Stone Weight Deduction (Grams):</label>
      <input type="number" id="stoneWeight" inputmode="decimal" autocomplete="off" value="" step="0.01">
    </div>
    <div class="input-group">
      <label for="sellDiscountTola">Shop Buying Rate Discount Per Tola (PKR):</label>
      <input type="number" id="sellDiscountTola" inputmode="decimal" autocomplete="off" value="" step="500">
    </div>
  </div>

  <div class="input-group">
    <div class="switch-header">
      <label id="wastageLabel">Wastage / Kaat</label>
      <div class="btn-group">
        <button id="btnWastagePercent" class="active" type="button">Percentage (%)</button>
        <button id="btnWastageFixed" type="button">Fixed Price (PKR)</button>
      </div>
    </div>
    <input type="number" id="wastageValue" inputmode="decimal" autocomplete="off" value="" step="0.5">
  </div>

  <div id="buyOptionsBox">
    <div class="input-group">
      <div class="switch-header">
        <label>🔨 Making Charges / Mazdoori (PKR)</label>
        <div class="btn-group">
          <button id="btnMakingFixed" class="active" type="button">Fixed Price</button>
          <button id="btnMakingPerGram" type="button">Per Gram</button>
        </div>
      </div>
      <input type="number" id="makingValue" inputmode="decimal" autocomplete="off" value="">
    </div>

    <div class="input-group">
      <label for="taxRate">Tax % (GST / Govt Tax):</label>
      <input type="number" id="taxRate" inputmode="decimal" autocomplete="off" value="" step="0.1">
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="taxOnSubtotal" checked>
      <label for="taxOnSubtotal">Apply Tax on Whole Subtotal (Gold + Wastage + Making)</label>
    </div>
  </div>

  <div class="result-box">
    <div class="result-title" id="resultTitle">Total Estimated Price</div>
    <div class="result-value" id="finalPrice">Rs. 0</div>
    <div class="result-words" id="finalPriceWords"></div>
    <div class="breakdown" id="priceBreakdown"></div>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (let registration of registrations) {
        registration.unregister();
      }
    });
  }

  const TOLA_GRAMS = 11.664;
  const MASHA_PER_TOLA = 12;
  const RATI_PER_MASHA = 8;
  const RATI_PER_TOLA = 96;

  let transactionMode = 'buy'; 
  let weightMode = 'gram';      
  let wastageMode = 'percent';  
  let makingMode = 'fixed';      

  function formatAmountInWords(num) {
    num = Math.round(num);
    if (!num || num <= 0) return '';
    let words = [];
    const crore = Math.floor(num / 10000000);
    num %= 10000000;
    const lakh = Math.floor(num / 100000);
    num %= 100000;
    const hazar = Math.floor(num / 1000);
    num %= 1000;
    const remaining = num;

    if (crore > 0) words.push(`${crore} Crore`);
    if (lakh > 0) words.push(`${lakh} Lakh`);
    if (hazar > 0) words.push(`${hazar} Hazar`);
    if (remaining > 0 && words.length === 0) words.push(`${remaining}`);

    return words.join(' ') + ' PKR';
  }

  function setTransactionMode(mode) {
    transactionMode = mode;
    document.getElementById('btnBuyMode').className = mode === 'buy' ? 'active' : '';
    document.getElementById('btnSellMode').className = mode === 'sell' ? 'active' : '';

    const buyBox = document.getElementById('buyOptionsBox');
    const sellBox = document.getElementById('sellOptionsBox');
    const wastageLabel = document.getElementById('wastageLabel');
    const resultTitle = document.getElementById('resultTitle');

    if (mode === 'buy') {
      buyBox.style.display = 'block';
      sellBox.style.display = 'none';
      wastageLabel.innerText = 'Wastage (Kaat Add)';
      resultTitle.innerText = 'Total Customer Pay Amount (Buy)';
    } else {
      buyBox.style.display = 'none';
      sellBox.style.display = 'block';
      wastageLabel.innerText = 'Kaat / Deduction';
      resultTitle.innerText = 'Total Customer Receive Amount (Sell)';
    }
    calculateItemPrice();
  }

  function setWastageMode(mode) {
    wastageMode = mode;
    document.getElementById('btnWastagePercent').className = mode === 'percent' ? 'active' : '';
    document.getElementById('btnWastageFixed').className = mode === 'fixed' ? 'active' : '';
    calculateItemPrice();
  }

  function setWeightMode(mode) {
    weightMode = mode;
    document.getElementById('btnGram').className = mode === 'gram' ? 'active' : '';
    document.getElementById('btnTmr').className = mode === 'tmr' ? 'active' : '';
    
    document.getElementById('gramInputBox').style.display = mode === 'gram' ? 'block' : 'none';
    document.getElementById('tmrInputBox').style.display = mode === 'tmr' ? 'block' : 'none';

    if (mode === 'tmr') {
      const currentGram = parseFloat(document.getElementById('itemWeightGram').value) || 0;
      if (currentGram > 0 && parseFloat(document.getElementById('inputTola').value) === 0) {
        syncGramsToTMR(currentGram);
      }
    }
    calculateItemPrice();
  }

  function syncGramsToTMR(grams) {
    const totalTolas = grams / TOLA_GRAMS;
    const tola = Math.floor(totalTolas);
    const remTola = totalTolas - tola;
    const totalMasha = remTola * MASHA_PER_TOLA;
    const masha = Math.floor(totalMasha);
    const remMasha = totalMasha - masha;
    const rati = Math.round(remMasha * RATI_PER_MASHA * 10) / 10;

    document.getElementById('inputTola').value = tola;
    document.getElementById('inputMasha').value = masha;
    document.getElementById('inputRati').value = rati;
  }

  function setMakingMode(mode) {
    makingMode = mode;
    document.getElementById('btnMakingFixed').className = mode === 'fixed' ? 'active' : '';
    document.getElementById('btnMakingPerGram').className = mode === 'perGram' ? 'active' : '';
    calculateItemPrice();
  }

  function calculateRates() {
    const rate24k = parseFloat(document.getElementById('rate24k').value) || 0;
    const rateWords = formatAmountInWords(rate24k);
    document.getElementById('rate24kWords').innerText = rateWords ? `🏷️ ${rateWords}` : '';

    const rate24kGram = rate24k / TOLA_GRAMS;
    const karats = [
      { name: '24 Karat', purity: 1.0 },
      { name: '22 Karat', purity: 22 / 24 },
      { name: '21 Karat', purity: 21 / 24 },
      { name: '18 Karat', purity: 18 / 24 },
      { name: '12 Karat', purity: 12 / 24 }
    ];

    let tableBody = '';
    karats.forEach(k => {
      const perTola = rate24k * k.purity;
      const perGram = rate24kGram * k.purity;
      tableBody += `
        <tr>
          <td><strong>${k.name}</strong></td>
          <td>Rs. ${Math.round(perTola).toLocaleString('en-PK')}</td>
          <td>Rs. ${Math.round(perGram).toLocaleString('en-PK')}</td>
        </tr>
      `;
    });

    document.getElementById('karatTable').innerHTML = tableBody;
    calculateItemPrice();
  }

  function calculateItemPrice() {
    const marketRate24k = parseFloat(document.getElementById('rate24k').value) || 0;
    let effective24kRate = marketRate24k;
    
    if (transactionMode === 'sell') {
      const discountTola = parseFloat(document.getElementById('sellDiscountTola').value) || 0;
      effective24kRate = Math.max(0, marketRate24k - discountTola);
    }

    const rate24kGram = effective24kRate / TOLA_GRAMS;
    let selectedKarat = parseFloat(document.getElementById('inputKarat').value) || 24;
    if (selectedKarat > 24) selectedKarat = 24;
    if (selectedKarat < 0) selectedKarat = 0;

    const purity = selectedKarat / 24;
    const karatTolaPrice = effective24kRate * purity;
    const karatGramPrice = rate24kGram * purity;

    document.getElementById('karatPurityDisplay').innerText = (purity * 100).toFixed(2) + '%';
    document.getElementById('karatTolaDisplay').innerText = 'Rs. ' + Math.round(karatTolaPrice).toLocaleString('en-PK');
    document.getElementById('karatGramDisplay').innerText = 'Rs. ' + Math.round(karatGramPrice).toLocaleString('en-PK');

    let grossGrams = 0;
    if (weightMode === 'gram') {
      grossGrams = parseFloat(document.getElementById('itemWeightGram').value) || 0;
    } else {
      const tola = parseFloat(document.getElementById('inputTola').value) || 0;
      const masha = parseFloat(document.getElementById('inputMasha').value) || 0;
      const rati = parseFloat(document.getElementById('inputRati').value) || 0;
      const totalTolas = tola + (masha / MASHA_PER_TOLA) + (rati / RATI_PER_TOLA);
      grossGrams = totalTolas * TOLA_GRAMS;
      document.getElementById('convertedGrams').innerText = grossGrams.toFixed(3);
    }

    let stoneDeduction = transactionMode === 'sell' ? (parseFloat(document.getElementById('stoneWeight').value) || 0) : 0;
    const netGrams = Math.max(0, grossGrams - stoneDeduction);
    const rawGoldPrice = netGrams * karatGramPrice;

    const wastageInputValue = parseFloat(document.getElementById('wastageValue').value) || 0;
    let wastageAmount = 0;
    let wastageLabelMode = '';

    if (wastageMode === 'percent') {
      wastageAmount = rawGoldPrice * (wastageInputValue / 100);
      wastageLabelMode = `${wastageInputValue}%`;
    } else {
      wastageAmount = wastageInputValue;
      wastageLabelMode = `Rs. ${wastageInputValue.toLocaleString('en-PK')} Fixed`;
    }

    let totalMaking = 0;
    let taxAmount = 0;
    let totalPrice = 0;

    const breakdownBox = document.getElementById('priceBreakdown');

    if (transactionMode === 'buy') {
      const makingInputValue = parseFloat(document.getElementById('makingValue').value) || 0;
      totalMaking = makingMode === 'fixed' ? makingInputValue : (makingInputValue * netGrams);

      const taxPercent = parseFloat(document.getElementById('taxRate').value) || 0;
      const isTaxOnSubtotal = document.getElementById('taxOnSubtotal').checked;

      if (isTaxOnSubtotal) {
        const subTotal = rawGoldPrice + wastageAmount + totalMaking;
        taxAmount = subTotal * (taxPercent / 100);
      } else {
        taxAmount = rawGoldPrice * (taxPercent / 100);
      }

      totalPrice = rawGoldPrice + wastageAmount + totalMaking + taxAmount;
      const taxLabelMode = isTaxOnSubtotal ? 'Full Subtotal' : 'Raw Gold Only';
      const makingLabelMode = makingMode === 'fixed' ? 'Fixed Total' : `Rs. ${makingInputValue} / gram`;

      breakdownBox.innerHTML = `
        • <strong>Selected Rate (${selectedKarat}K):</strong> Rs. ${Math.round(karatGramPrice).toLocaleString('en-PK')} / gram<br>
        • <strong>Calculated Weight:</strong> ${netGrams.toFixed(3)} grams<br>
        • <strong>Raw Gold Price:</strong> Rs. ${Math.round(rawGoldPrice).toLocaleString('en-PK')}<br>
        • <strong>Wastage Amount (+${wastageLabelMode}):</strong> Rs. ${Math.round(wastageAmount).toLocaleString('en-PK')}<br>
        • <strong>Making Charges (${makingLabelMode}):</strong> Rs. ${Math.round(totalMaking).toLocaleString('en-PK')}<br>
        • <strong>Tax Amount (${taxPercent}% on ${taxLabelMode}):</strong> Rs. ${Math.round(taxAmount).toLocaleString('en-PK')}
      `;

    } else {
      totalPrice = Math.max(0, rawGoldPrice - wastageAmount);
      const discountTola = parseFloat(document.getElementById('sellDiscountTola').value) || 0;

      breakdownBox.innerHTML = `
        • <strong>Buying Rate (${selectedKarat}K):</strong> Rs. ${Math.round(karatGramPrice).toLocaleString('en-PK')} / gram <em>(-Rs. ${discountTola}/tola)</em><br>
        • <strong>Gross Weight:</strong> ${grossGrams.toFixed(3)} grams<br>
        • <strong>Nag / Stone Deduction:</strong> -${stoneDeduction.toFixed(3)} grams<br>
        • <strong>Net Gold Weight:</strong> ${netGrams.toFixed(3)} grams<br>
        • <strong>Base Gold Value:</strong> Rs. ${Math.round(rawGoldPrice).toLocaleString('en-PK')}<br>
        • <strong>Kaat / Deduction (-${wastageLabelMode}):</strong> -Rs. ${Math.round(wastageAmount).toLocaleString('en-PK')}
      `;
    }

    document.getElementById('finalPrice').innerText = 'Rs. ' + Math.round(totalPrice || 0).toLocaleString('en-PK');
    document.getElementById('finalPriceWords').innerText = formatAmountInWords(totalPrice);
  }

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('rate24k').addEventListener('input', calculateRates);
    document.getElementById('inputKarat').addEventListener('input', calculateItemPrice);
    document.getElementById('itemWeightGram').addEventListener('input', calculateItemPrice);
    document.getElementById('inputTola').addEventListener('input', calculateItemPrice);
    document.getElementById('inputMasha').addEventListener('input', calculateItemPrice);
    document.getElementById('inputRati').addEventListener('input', calculateItemPrice);
    document.getElementById('stoneWeight').addEventListener('input', calculateItemPrice);
    document.getElementById('sellDiscountTola').addEventListener('input', calculateItemPrice);
    document.getElementById('wastageValue').addEventListener('input', calculateItemPrice);
    document.getElementById('makingValue').addEventListener('input', calculateItemPrice);
    document.getElementById('taxRate').addEventListener('input', calculateItemPrice);
    document.getElementById('taxOnSubtotal').addEventListener('change', calculateItemPrice);

    document.getElementById('btnBuyMode').addEventListener('click', () => setTransactionMode('buy'));
    document.getElementById('btnSellMode').addEventListener('click', () => setTransactionMode('sell'));
    document.getElementById('btnGram').addEventListener('click', () => setWeightMode('gram'));
    document.getElementById('btnTmr').addEventListener('click', () => setWeightMode('tmr'));
    document.getElementById('btnWastagePercent').addEventListener('click', () => setWastageMode('percent'));
    document.getElementById('btnWastageFixed').addEventListener('click', () => setWastageMode('fixed'));
    document.getElementById('btnMakingFixed').addEventListener('click', () => setMakingMode('fixed'));
    document.getElementById('btnMakingPerGram').addEventListener('click', () => setMakingMode('perGram'));

    calculateRates();
  });
</script>


<script>
  // 1. Force Clear Storage & Old SW
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
      for (let registration of registrations) {
        registration.unregister();
      }
    });
  }

  if ('caches' in window) {
    caches.keys().then(names => {
      for (let name of names) {
        caches.delete(name);
      }
    });
  }

  // 2. Prevent Chrome Stale Reloading
  window.addEventListener('pageshow', (event) => {
    if (event.persisted) {
      window.location.reload();
    }
  });
</script>
</body>
</html>
